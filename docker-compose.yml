services:
    redis:
        image: redis:8-alpine
        container_name: queueworks-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - queueworks-redis-data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    queueworks-redis-data:
